<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" font-family="Segoe UI, Arial, sans-serif">
  <title>Cricket auction architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="350" fill="#ffffff"/>
  <g>
    <rect x="40" y="30" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="130" y="52" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">Admin panel</text>
    <text x="130" y="70" text-anchor="middle" font-size="12" fill="#0F6E56">Setup, draw, sold</text>
    <rect x="250" y="30" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="340" y="52" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">Big screen</text>
    <text x="340" y="70" text-anchor="middle" font-size="12" fill="#0F6E56">Live bid and stats</text>
    <rect x="460" y="30" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
    <text x="550" y="52" text-anchor="middle" font-size="15" font-weight="600" fill="#085041">Owner phones</text>
    <text x="550" y="70" text-anchor="middle" font-size="12" fill="#0F6E56">10 logins, bid buttons</text>
  </g>
  <g stroke="#444" stroke-width="1.5" fill="none">
    <line x1="130" y1="90" x2="130" y2="146" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="340" y1="90" x2="340" y2="146" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="550" y1="90" x2="550" y2="146" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="340" y1="224" x2="340" y2="266" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <rect x="40" y="150" width="600" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="340" y="177" text-anchor="middle" font-size="15" font-weight="600" fill="#3C3489">Auction server (.NET, SignalR WebSockets)</text>
  <text x="340" y="199" text-anchor="middle" font-size="12" fill="#534AB7">Bids, timer, purse rules</text>
  <rect x="220" y="270" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="340" y="292" text-anchor="middle" font-size="15" font-weight="600" fill="#2C2C2A">Database</text>
  <text x="340" y="310" text-anchor="middle" font-size="12" fill="#5F5E5A">Players, owners, bids, squads</text>
</svg>
