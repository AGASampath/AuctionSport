<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="Segoe UI, Arial, sans-serif">
  <title>Bidding flow for one player</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#ffffff"/>
  <g fill="#F1EFE8" stroke="#5F5E5A">
    <rect x="40" y="40" width="130" height="50" rx="8"/>
  </g>
  <text x="105" y="65" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Idle</text>
  <g fill="#E1F5EE" stroke="#0F6E56">
    <rect x="275" y="40" width="130" height="50" rx="8"/>
    <rect x="510" y="40" width="130" height="50" rx="8"/>
    <rect x="510" y="300" width="130" height="56" rx="8"/>
  </g>
  <text x="340" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Player picked</text>
  <text x="340" y="76" text-anchor="middle" font-size="12" fill="#0F6E56">Shown on all screens</text>
  <text x="575" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Bidding open</text>
  <text x="575" y="76" text-anchor="middle" font-size="12" fill="#0F6E56">Owners tap buttons</text>
  <text x="575" y="321" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Sold</text>
  <text x="575" y="339" text-anchor="middle" font-size="12" fill="#0F6E56">Purse reduced</text>
  <g fill="#EEEDFE" stroke="#534AB7">
    <rect x="510" y="170" width="130" height="56" rx="8"/>
  </g>
  <text x="575" y="191" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Confirm timer</text>
  <text x="575" y="209" text-anchor="middle" font-size="12" fill="#534AB7">Resets on every bid</text>
  <g fill="#FAEEDA" stroke="#854F0B">
    <rect x="275" y="170" width="130" height="56" rx="8"/>
    <rect x="275" y="300" width="130" height="56" rx="8"/>
  </g>
  <text x="340" y="191" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">Unsold</text>
  <text x="340" y="209" text-anchor="middle" font-size="12" fill="#854F0B">No bids placed</text>
  <text x="340" y="321" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">Round 2</text>
  <text x="340" y="339" text-anchor="middle" font-size="12" fill="#854F0B">Unsold return to pool</text>
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="172" y1="65" x2="273" y2="65"/>
    <line x1="407" y1="65" x2="508" y2="65"/>
    <line x1="575" y1="92" x2="575" y2="168"/>
    <line x1="575" y1="228" x2="575" y2="298"/>
    <line x1="520" y1="92" x2="407" y2="188"/>
    <line x1="340" y1="228" x2="340" y2="298"/>
    <path d="M575 358 V400 H105 V92"/>
  </g>
  <line x1="275" y1="328" x2="105" y2="328" stroke="#444" stroke-width="1.5"/>
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="222" y="58">Pick random</text>
    <text x="457" y="58">Start</text>
    <text x="608" y="134">First bid</text>
    <text x="608" y="268">Time runs out</text>
    <text x="437" y="128">No bids</text>
    <text x="378" y="266">End of round 1</text>
    <text x="340" y="418">Next player</text>
  </g>
  <text x="340" y="440" text-anchor="middle" font-size="12" fill="#5d6d63">Admin can pause and resume during bidding, and undo the last sale.</text>
</svg>
