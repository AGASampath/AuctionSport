<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="Segoe UI, Arial, sans-serif">
  <title>Cricket auction use case diagram</title>
  <rect width="680" height="480" fill="#ffffff"/>
  <rect x="120" y="52" width="440" height="388" rx="20" fill="none" stroke="#888" stroke-dasharray="6 4"/>
  <text x="340" y="76" text-anchor="middle" font-size="15" font-weight="600" fill="#15221a">Auction system</text>
  <g stroke="#555" stroke-width="1">
    <line x1="80" y1="240" x2="142" y2="122"/><line x1="80" y1="240" x2="140" y2="178"/>
    <line x1="80" y1="240" x2="140" y2="234"/><line x1="80" y1="240" x2="140" y2="290"/>
    <line x1="80" y1="240" x2="142" y2="346"/><line x1="80" y1="240" x2="146" y2="402"/>
    <line x1="600" y1="190" x2="540" y2="122"/><line x1="600" y1="190" x2="540" y2="178"/>
    <line x1="600" y1="190" x2="540" y2="234"/><line x1="600" y1="190" x2="540" y2="290"/>
    <line x1="575" y1="350" x2="540" y2="346"/>
  </g>
  <g fill="#E1F5EE" stroke="#0F6E56">
    <ellipse cx="230" cy="122" rx="90" ry="22"/><ellipse cx="230" cy="178" rx="90" ry="22"/>
    <ellipse cx="230" cy="234" rx="90" ry="22"/><ellipse cx="230" cy="290" rx="90" ry="22"/>
    <ellipse cx="230" cy="346" rx="90" ry="22"/><ellipse cx="230" cy="402" rx="90" ry="22"/>
  </g>
  <g fill="#EEEDFE" stroke="#534AB7">
    <ellipse cx="450" cy="122" rx="90" ry="22"/><ellipse cx="450" cy="178" rx="90" ry="22"/>
    <ellipse cx="450" cy="234" rx="90" ry="22"/><ellipse cx="450" cy="290" rx="90" ry="22"/>
    <ellipse cx="450" cy="346" rx="90" ry="22"/>
  </g>
  <g font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="230" y="122" fill="#085041">Manage players</text>
    <text x="230" y="178" fill="#085041">Manage owners</text>
    <text x="230" y="234" fill="#085041">Set budgets, rules</text>
    <text x="230" y="290" fill="#085041">Pick by category</text>
    <text x="230" y="346" fill="#085041">Start auction</text>
    <text x="230" y="402" fill="#085041">Sold or unsold</text>
    <text x="450" y="122" fill="#3C3489">Log in</text>
    <text x="450" y="178" fill="#3C3489">View player</text>
    <text x="450" y="234" fill="#3C3489">Place bid</text>
    <text x="450" y="290" fill="#3C3489">Check purse, squad</text>
    <text x="450" y="346" fill="#3C3489">Show live bid</text>
  </g>
  <g fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round">
    <circle cx="60" cy="215" r="10"/>
    <path d="M60 225 L60 255 M40 235 L80 235 M60 255 L45 278 M60 255 L75 278"/>
    <circle cx="620" cy="165" r="10"/>
    <path d="M620 175 L620 205 M600 185 L640 185 M620 205 L605 228 M620 205 L635 228"/>
  </g>
  <text x="60" y="298" text-anchor="middle" font-size="14" font-weight="600" fill="#15221a">Admin</text>
  <text x="620" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#15221a">Team owner</text>
  <rect x="575" y="330" width="90" height="40" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="620" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Big screen</text>
</svg>
